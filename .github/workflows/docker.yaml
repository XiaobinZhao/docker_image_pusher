name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main, swe-batch-* ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 释放预装工具与预置镜像占用的空间
    # 注意：当前 ubuntu-latest 系统盘已是 145G（约 86G 可用），足够转存 10GB 级镜像；
    # 原 easimon/maximize-build-space 会建 /pv.img 占满根盘、把 / 压到只剩约 100M，
    # 导致 runner 自身写 _diag 日志时 ENOSPC 直接崩溃（日志无法上传），故不再使用。
    - name: Free up disk space
      run: |
        set -x
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune -af || true
        sudo docker builder prune -af || true
        df -hT /

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 构建 build: 行指定的镜像（从 GitHub 源码仓库构建并推送阿里云）
        # 格式: build:<owner>/<repo> <ref> <aliyun_image>
        while IFS= read -r line || [ -n "$line" ]; do
            # 去掉首尾空白（含 Windows CRLF 残留），避免空行/畸形行被当成镜像
            line=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            echo "$line" | grep -q '^build:' || continue

            spec="${line#build:}"
            repo=$(echo "$spec" | awk '{print $1}')
            ref=$(echo "$spec" | awk '{print $2}')
            build_image=$(echo "$spec" | awk '{print $3}')

            echo "=== Building $build_image from https://github.com/$repo.git ($ref) ==="
            rm -rf /tmp/sglang-src
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" /tmp/sglang-src
            docker build -t "$build_image" -f /tmp/sglang-src/docker/gateway.Dockerfile /tmp/sglang-src
            echo "docker push $build_image"
            docker push "$build_image"
            docker rmi "$build_image"
            rm -rf /tmp/sglang-src
        done < images.txt
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            line=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            # build: 行已在上方构建步骤处理，跳过
            if echo "$line" | grep -q '^build:'; then
                continue
            fi
            
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 去掉首尾空白（含 Windows CRLF 残留），避免空行/畸形行被当成镜像
            line=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            # build: 行已在上方构建步骤处理，跳过
            if echo "$line" | grep -q '^build:'; then
                continue
            fi
            # 阿里云源镜像：已在阿里云（由外部 workflow 构建推送），无需搬运；
            # GitHub 海外 runner pull 阿里云 ACR 个人版会 404。仅登记供同步工具解析。
            if echo "$line" | grep -q "^$ALIYUN_REGISTRY/"; then
                echo "skip (already in Aliyun): $line"
                continue
            fi

            # 防御：畸形行（只剩 --platform 之类参数、或解析不出镜像名）直接跳过，
            # 避免 docker pull 收到空参数导致整轮失败（历史 run #230/#231 即此原因）
            image=$(echo "$line" | awk '{print $NF}')
            if [ -z "$image" ] || [ "${image#--}" != "$image" ]; then
                echo "skip (no image name): $line"
                continue
            fi
            echo "docker pull $line"
            docker pull $line
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            docker push $new_image
            docker rmi $image
            docker rmi $new_image
            
        done < images.txt
